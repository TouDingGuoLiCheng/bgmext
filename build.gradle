plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'com.bgmext'
archivesBaseName = 'bgmext'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg '-mixin.config=bgmext.mixins.json'
            mods {
                bgmext {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'bgmext.refmap.json'
    config 'bgmext.mixins.json'
}

repositories {
    mavenCentral()
}

// 这些库必须真的打进模组 JAR，否则游戏里会 NoClassDefFoundError
configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    shade 'net.jthink:jaudiotagger:3.0.1'
    shade 'javazoom:jlayer:1.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '1.20.1',
            forge_version: '47.3.0',
            loader_version_range: '[47,)',
            mod_id: 'bgmext',
            mod_version: project.version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    manifest {
        attributes([
            'MixinConfigs': 'bgmext.mixins.json'
        ])
    }

    // 把 shade 依赖解包进 JAR
    from({
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/LICENSE*'
        exclude 'META-INF/NOTICE*'
        exclude 'META-INF/versions/**'
        exclude 'module-info.class'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
