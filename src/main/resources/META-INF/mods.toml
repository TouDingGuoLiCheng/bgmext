modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "bgmext"
version = "${mod_version}"
displayName = "BGM扩展"
logoFile = ""
description = '''
让玩家自由管理游戏背景音乐：
• 支持 ogg / mp3 / wav / flac 格式的自定义音乐
• 保留原版六分类（主菜单/生存/创造/下界/末地/水下）
• 可视化 GUI 管理原版与自定义曲目的启用/禁用
• 自定义音乐融入原版随机播放池
• 删除自定义音乐直接清理磁盘文件

使用方式：
1. 将音频文件放入 config/bgmext/music/<category>/ 对应分类目录
2. 进入游戏，ESC → ♪ 音乐设置 → 重新扫描
3. 在 GUI 中启用/禁用/删除音乐
'''
authors = ""

[[dependencies.bgmext]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.bgmext]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1]"
ordering = "NONE"
side = "CLIENT"